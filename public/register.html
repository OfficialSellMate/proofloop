<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account — ProofLoop</title>
  <meta name="theme-color" content="#2457F5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html"><span class="brand-mark"></span>ProofLoop</a>
    </div>
  </header>

  <main id="main" class="auth-page">
    <div class="card auth-card">
      <h1>Create your account</h1>
      <p class="text-secondary">Set up your free ProofLoop account.</p>

      <p class="notice" role="note">Preview only: sign-up is not connected yet, so no account will be created.</p>

      <!-- Layout only. Firebase sign-up will be connected in Phase 2. -->
      <form onsubmit="return false">
        <div class="form-group">
          <label class="label" for="reg-name">Full name</label>
          <input class="input" id="reg-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label class="label" for="reg-email">Email</label>
          <input class="input" id="reg-email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <label class="label" for="reg-password">Password</label>
          <input class="input" id="reg-password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="reg-password-hint" required>
          <p class="field-hint" id="reg-password-hint">Use at least 8 characters.</p>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

</body>
</html>
