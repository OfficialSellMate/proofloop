<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — ProofLoop</title>
  <meta name="theme-color" content="#2457F5">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html"><span class="brand-mark"></span>ProofLoop</a>
    </div>
  </header>

  <main id="main" class="auth-page">
    <div class="card auth-card">
      <h1>Log in</h1>
      <p class="text-secondary">Welcome back. Log in to see your projects.</p>

      <p class="notice" role="note">Preview only: log in and password reset are not connected yet.</p>

      <!-- Layout only. Firebase login will be connected in Phase 2. -->
      <form onsubmit="return false">
        <div class="form-group">
          <label class="label" for="login-email">Email</label>
          <input class="input" id="login-email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="form-group">
          <div class="label-row">
            <label class="label" for="login-password">Password</label>
            <a href="#">Forgot password?</a>
          </div>
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>

      <p class="auth-footer">New to ProofLoop? <a href="register.html">Create an account</a></p>
    </div>
  </main>

</body>
</html>
